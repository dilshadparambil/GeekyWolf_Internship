<!DOCTYPE html>
<html>
<head>
  <title>Document</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h3>1. Display User Input Type</h3>
    <input type="text" id="userInput">
    <button id="checkTypeBtn">Check Type</button>
    <p id="displayType"></p>

    <h3>2. Sum of Two Numbers</h3>
    <input type="number" id="num1" >
    <input type="number" id="num2" >
    <button id="sumBtn">Calculate</button>
    <p id="sumResult"></p>

    <h3>3. Boolean Toggle Message</h3>
    <button id="toggleBtn">Show Message</button>
    <p id="message" style="display:none;">Hello World</p>

    <h3>4. Array of Favorite Colors</h3>
    <input type="text" id="colorInput">
    <button id="addColorBtn">Add Color</button>
    <ul id="colorList"></ul>

    <h3>5. Object Display</h3>
    <button id="showStudentBtn">Show Student Info</button>
    <p id="studentInfo"></p>

    <h3>6. Change Background Color</h3>
    <button id="redBtn">Red</button>
    <button id="greenBtn">Green</button>
    <button id="blueBtn">Blue</button>

  <script src="script.js"></script>
</body>
</html>
